<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#f5f4f0">
  <meta name="description" content="">
  <meta property="og:locale" content="id_ID">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Undangan Iyan None & Indah">
  <meta property="og:title" content="Undangan Pernikahan Iyan None & Indah">
  <meta property="og:description" content="Dengan penuh syukur, kami mengundang Anda untuk menjadi bagian dari hari bahagia kami pada 6 Desember 2026.">
  <meta property="og:url" content="https://herutriyadih2-cloud.github.io/undangan-iyan-indah/">
  <meta property="og:image" content="https://herutriyadih2-cloud.github.io/undangan-iyan-indah/assets/images/og-whatsapp.png">
  <meta property="og:image:secure_url" content="https://herutriyadih2-cloud.github.io/undangan-iyan-indah/assets/images/og-whatsapp.png">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Undangan pernikahan Iyan None dan Indah, 6 Desember 2026">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Undangan Pernikahan Iyan None & Indah">
  <meta name="twitter:description" content="Dengan penuh syukur, kami mengundang Anda untuk menjadi bagian dari hari bahagia kami pada 6 Desember 2026.">
  <meta name="twitter:image" content="https://herutriyadih2-cloud.github.io/undangan-iyan-indah/assets/images/og-whatsapp.png">
  <meta name="twitter:image:alt" content="Undangan pernikahan Iyan None dan Indah, 6 Desember 2026">
  <title></title>
  <link rel="stylesheet" href="css/style.css?v=20261115-01">
  <script defer src="js/data.js?v=20261115-01"></script>
  <script defer src="js/scene.js?v=20261115-01"></script>
  <script defer src="js/theme.js?v=20261115-01"></script>
  <script defer src="js/main.js?v=20261115-01"></script>
</head>
<body class="is-locked">
  <a class="skip-link" id="skipLink" href="#invitation"></a>

  <section class="cover" id="cover" aria-labelledby="coverTitle">
    <div class="cover-grain" aria-hidden="true"></div>
    <div class="cover-shell">
      <div class="cover-copy">
        <img class="cover-floral cover-floral-top" data-asset="floral" alt="" aria-hidden="true">
        <p class="eyebrow" id="coverEyebrow"></p>
        <div class="fine-rule" aria-hidden="true"><span></span><i></i><span></span></div>
        <h1 class="cover-title script" id="coverTitle"></h1>
        <p class="cover-date" id="coverDate"></p>
        <p class="cover-intro" id="coverIntro"></p>
        <div class="guest-card">
          <p class="guest-greeting" id="guestGreeting"></p>
          <p class="guest-name" id="guestName"></p>
          <p class="guest-note" id="guestNote"></p>
        </div>
        <button class="button button-primary open-button" id="openInvitation" type="button">
          <span id="openLabel"></span>
          <span class="button-arrow" aria-hidden="true">→</span>
        </button>
        <p class="button-hint" id="openHint"></p>
      </div>

      <div class="cover-art" aria-hidden="false">
        <div class="cover-halo" aria-hidden="true"></div>
        <div class="arch-frame cover-arch">
          <img class="arch-outline" data-asset="arch" alt="" aria-hidden="true">
          <div class="arch-photo-wrap">
            <img class="arch-photo" id="coverPhoto" data-asset="couple" alt="">
          </div>
        </div>
        <img class="cover-floral cover-floral-bottom" data-asset="floral" alt="" aria-hidden="true">
        <div class="cover-monogram" aria-hidden="true"><span id="monogramLeft"></span><i></i><span id="monogramRight"></span></div>
      </div>
    </div>
    <div class="cover-number" id="coverNumber" aria-hidden="true"></div>
  </section>

  <section class="scene" id="scene" aria-labelledby="sceneTitle" hidden>
    <div class="scene-viewport" id="sceneViewport">
      <div class="scene-world" id="sceneWorld" aria-hidden="true">
        <div class="scene-light"></div>
        <div class="scene-corridor">
          <div class="corridor-ceiling"></div>
          <div class="corridor-floor"></div>
          <div class="corridor-line line-one"></div>
          <div class="corridor-line line-two"></div>
          <div class="corridor-line line-three"></div>
        </div>
        <div class="scene-depth depth-back" data-depth="0.15">
          <img class="scene-arch arch-back" data-asset="arch" alt="">
        </div>
        <div class="scene-depth depth-middle" data-depth="0.35">
          <img class="scene-arch arch-middle" data-asset="arch" alt="">
          <div class="scene-candles candles-left">
            <i></i><i></i><i></i>
          </div>
          <div class="scene-candles candles-right">
            <i></i><i></i><i></i>
          </div>
        </div>
        <div class="scene-depth depth-portrait" data-depth="0.55">
          <div class="scene-portrait">
            <div class="portrait-glow"></div>
            <img id="scenePhoto" data-asset="couple" alt="">
          </div>
        </div>
        <div class="scene-depth depth-copy" data-depth="0.7">
          <div class="scene-copy">
            <p class="scene-eyebrow" id="sceneEyebrow"></p>
            <h2 class="scene-title script" id="sceneTitle"></h2>
            <p class="scene-subtitle" id="sceneSubtitle"></p>
            <div class="scene-date-block">
              <span id="sceneSaveDate"></span>
              <strong id="sceneDate"></strong>
            </div>
          </div>
        </div>
        <div class="scene-depth depth-floral" data-depth="0.9">
          <img class="scene-floral floral-left" data-asset="floral" alt="">
          <img class="scene-floral floral-right" data-asset="floral" alt="">
        </div>
        <div class="scene-vignette"></div>
      </div>
    </div>

    <div class="scene-topbar">
      <div class="scene-actions">
        <button class="button button-glass" id="replayScene" type="button"></button>
        <button class="button button-glass" id="skipScene" type="button"></button>
      </div>
    </div>
    <p class="sr-only" id="motionNotice"></p>
    <div class="scene-progress" aria-hidden="true"><span id="sceneProgress"></span></div>
  </section>

  <nav class="invitation-nav" id="invitationNav" aria-label="" hidden>
    <div class="nav-links" id="navLinks"></div>
    <button class="nav-icon" id="navReplay" type="button" aria-label="" title="">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10a8 8 0 1 1 2 7M4 10V4m0 6h6"/></svg>
    </button>
    <button class="nav-icon" id="audioToggle" type="button" aria-label="" title="" hidden>
      <svg class="sound-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 9v6h4l5 4V5L9 9H5Zm12 0a5 5 0 0 1 0 6m2-9a9 9 0 0 1 0 12"/></svg>
      <svg class="sound-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 9v6h4l5 4V5L9 9H5Zm12 1 4 4m0-4-4 4"/></svg>
    </button>
    <audio id="backgroundAudio" preload="none"></audio>
  </nav>

  <main id="invitation" tabindex="-1" hidden>
    <section class="hero section" id="home" aria-labelledby="heroTitle">
      <div class="hero-watermark script" id="heroWatermark" aria-hidden="true"></div>
      <img class="hero-floral hero-floral-left" data-asset="floral" alt="" aria-hidden="true">
      <img class="hero-floral hero-floral-right" data-asset="floral" alt="" aria-hidden="true">
      <div class="hero-inner">
        <div class="hero-copy reveal">
          <p class="eyebrow" id="heroEyebrow"></p>
          <h1 class="hero-title script" id="heroTitle"></h1>
          <div class="fine-rule" aria-hidden="true"><span></span><i></i><span></span></div>
          <p class="hero-date" id="heroDate"></p>
          <p class="hero-invitation" id="heroInvitation"></p>
          <a class="text-link" href="#countdown"><span id="heroScroll"></span><i aria-hidden="true">↓</i></a>
        </div>
        <div class="hero-art reveal">
          <div class="arch-frame hero-arch">
            <img class="arch-outline" data-asset="arch" alt="" aria-hidden="true">
            <div class="arch-photo-wrap">
              <img class="arch-photo" id="heroPhoto" data-asset="couple" alt="">
            </div>
          </div>
          <div class="hero-date-seal" aria-hidden="true"><span id="sealDay"></span><small id="sealMonth"></small><span id="sealYear"></span></div>
        </div>
      </div>
    </section>

    <section class="countdown-section section" id="countdown" aria-labelledby="countdownTitle">
      <div class="section-inner narrow center reveal">
        <p class="eyebrow" id="countdownEyebrow"></p>
        <h2 class="section-title" id="countdownTitle"></h2>
        <p class="section-intro" id="countdownDescription"></p>
        <div class="countdown" id="countdownTimer" role="timer" aria-live="off">
          <div class="countdown-item"><strong id="days">000</strong><span id="daysLabel"></span></div>
          <div class="countdown-divider" aria-hidden="true">:</div>
          <div class="countdown-item"><strong id="hours">00</strong><span id="hoursLabel"></span></div>
          <div class="countdown-divider" aria-hidden="true">:</div>
          <div class="countdown-item"><strong id="minutes">00</strong><span id="minutesLabel"></span></div>
          <div class="countdown-divider" aria-hidden="true">:</div>
          <div class="countdown-item"><strong id="seconds">00</strong><span id="secondsLabel"></span></div>
        </div>
        <p class="countdown-complete" id="countdownComplete" hidden></p>
      </div>
    </section>

    <section class="quote-section section" id="quote" aria-labelledby="quoteCitation">
      <div class="quote-ornament" aria-hidden="true">❧</div>
      <blockquote class="section-inner narrow center reveal">
        <p class="quote-arabic" id="quoteArabic" lang="ar" dir="rtl"></p>
        <div class="fine-rule" aria-hidden="true"><span></span><i></i><span></span></div>
        <p class="quote-text" id="quoteText"></p>
        <cite id="quoteCitation"></cite>
      </blockquote>
    </section>

    <section class="profiles-section section" id="couple" aria-labelledby="profilesTitle">
      <div class="section-inner">
        <header class="section-header center reveal">
          <p class="eyebrow" id="profilesEyebrow"></p>
          <h2 class="section-title script" id="profilesTitle"></h2>
          <p class="section-intro" id="profilesIntro"></p>
        </header>
        <div class="profiles-grid" id="profilesGrid"></div>
      </div>
    </section>

    <section class="events-section section" id="events" aria-labelledby="eventsTitle">
      <img class="events-floral" data-asset="floral" alt="" aria-hidden="true">
      <div class="section-inner">
        <header class="section-header center reveal">
          <p class="eyebrow light" id="eventsEyebrow"></p>
          <h2 class="section-title script" id="eventsTitle"></h2>
          <p class="section-intro" id="eventsIntro"></p>
          <p class="time-hint" id="calendarHint"></p>
        </header>
        <div class="events-grid" id="eventsGrid"></div>
        <figure class="location-visual reveal">
          <div class="location-map-layout">
            <a class="location-image-link" id="locationVisualLink" href="" target="_blank" rel="noopener noreferrer" aria-label="">
              <span class="location-map-wrap" id="locationMapWrap"></span>
            </a>
            <aside class="location-qr-static" aria-label="QR lokasi">
              <img id="locationQrImage" src="" alt="">
            </aside>
          </div>
          <figcaption>
            <span id="locationVisualCaption"></span>
            <a class="button button-outline" id="locationMapsButton" href="" target="_blank" rel="noopener noreferrer"></a>
          </figcaption>
        </figure>
      </div>
    </section>

    <section class="gifts-section section" id="gifts" aria-labelledby="giftsTitle">
      <div class="section-inner narrow">
        <header class="section-header center reveal">
          <p class="eyebrow" id="giftsEyebrow"></p>
          <h2 class="section-title script" id="giftsTitle"></h2>
          <p class="section-intro" id="giftsIntro"></p>
        </header>
        <div class="gifts-grid" id="giftsGrid"></div>
      </div>
    </section>

    <section class="gallery-section section" id="gallery" aria-labelledby="galleryTitle">
      <div class="section-inner">
        <header class="section-header center reveal">
          <p class="eyebrow" id="galleryEyebrow"></p>
          <h2 class="section-title script" id="galleryTitle"></h2>
          <p class="section-intro" id="galleryIntro"></p>
        </header>
        <div class="gallery-viewer reveal">
          <div class="gallery-main-wrap">
            <figure class="gallery-main">
              <video id="galleryVideo" muted loop playsinline preload="metadata" poster="" aria-describedby="galleryDescription galleryCaption" disablepictureinpicture controlslist="nodownload nofullscreen noremoteplayback">
                <source id="galleryVideoSource" src="" type="video/mp4">
              </video>
              <img class="gallery-couple" id="galleryCouple" src="" alt="">
              <figcaption><span id="galleryCaption"></span><small id="galleryMeta"></small></figcaption>
            </figure>
          </div>
          <p class="sr-only" id="galleryDescription"></p>
          <div class="gallery-controls">
            <button class="button button-outline gallery-toggle" id="galleryToggle" type="button" aria-label=""></button>
            <p class="gallery-status" id="galleryStatus" role="status" aria-live="polite" aria-atomic="true"></p>
          </div>
        </div>
      </div>
    </section>

    <section class="comments-section section" id="comments" aria-labelledby="commentsTitle">
      <div class="section-inner narrow center">
        <header class="section-header reveal">
          <p class="eyebrow" id="commentsEyebrow"></p>
          <h2 class="section-title script" id="commentsTitle"></h2>
          <p class="section-intro" id="commentsIntro"></p>
        </header>
        <div class="comments-carousel reveal" id="commentsCarousel" role="group" aria-roledescription="carousel" aria-label="Contoh ucapan dan komentar" tabindex="0">
          <figure class="comment-card" id="commentCard">
            <div class="comment-quote-icon" aria-hidden="true">
              <svg viewBox="0 0 48 48"><path d="M10 27c0-8 4-13 12-15l1 4c-5 2-7 4-7 7h6v13H10V27Zm20 0c0-8 4-13 12-15l1 4c-5 2-7 4-7 7h6v13H30V27Z"/></svg>
            </div>
            <blockquote><p id="commentText"></p></blockquote>
            <figcaption>
              <span class="comment-category" id="commentCategory"></span>
              <span class="comment-example" id="commentExampleLabel"></span>
              <small class="comment-counter" id="commentCounter"></small>
            </figcaption>
          </figure>
          <div class="comments-controls">
            <button class="comment-arrow" id="commentsPrev" type="button" aria-label="">←</button>
            <div class="comments-indicators" id="commentsIndicators"></div>
            <button class="comment-arrow" id="commentsNext" type="button" aria-label="">→</button>
          </div>
          <button class="comment-pause" id="commentsToggle" type="button" aria-label="" aria-pressed="false"></button>
        </div>
      </div>
    </section>

    <section class="rsvp-section section" id="rsvp" aria-labelledby="rsvpTitle">
      <div class="section-inner narrow center reveal">
        <p class="eyebrow" id="rsvpEyebrow"></p>
        <h2 class="section-title script" id="rsvpTitle"></h2>
        <p class="section-intro" id="rsvpIntro"></p>
        <form class="rsvp-form" id="rsvpForm" novalidate>
          <label class="rsvp-label" id="rsvpGuestLabel" for="rsvpGuestName"></label>
          <input class="rsvp-input" id="rsvpGuestName" type="text" maxlength="60" autocomplete="name" inputmode="text" required>
          <div class="rsvp-choice-group">
            <a class="button button-primary rsvp-choice" id="rsvpAttend" href="" target="_blank" rel="noopener noreferrer">
              <svg class="whatsapp-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11.5a8 8 0 0 1-11.8 7L4 19.5l1.1-4A8 8 0 1 1 20 11.5Z"/><path d="M9 8.5c.5 3 2 4.5 5 5l1-1c.5-.5 1.5.5 1 1.5s-2 1-3.5.5-4-3-4.5-5.5c-.2-1.5.5-2 1-2S9.5 8 9 8.5Z"/></svg>
              <span id="rsvpAttendLabel"></span>
            </a>
            <a class="button button-outline rsvp-choice" id="rsvpDecline" href="" target="_blank" rel="noopener noreferrer">
              <svg class="whatsapp-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11.5a8 8 0 0 1-11.8 7L4 19.5l1.1-4A8 8 0 1 1 20 11.5Z"/><path d="M9 8.5c.5 3 2 4.5 5 5l1-1c.5-.5 1.5.5 1 1.5s-2 1-3.5.5-4-3-4.5-5.5c-.2-1.5.5-2 1-2S9.5 8 9 8.5Z"/></svg>
              <span id="rsvpDeclineLabel"></span>
            </a>
          </div>
          <p class="rsvp-status" id="rsvpStatus" role="status" aria-live="polite" aria-atomic="true"></p>
          <div class="share-preview">
            <label class="rsvp-label" id="sharePreviewLabel" for="shareLink"></label>
            <div class="share-link-row">
              <input class="rsvp-input" id="shareLink" type="text" readonly>
              <button class="button button-outline" id="copyShareLink" type="button"></button>
            </div>
          </div>
          <p class="rsvp-status" id="copyStatus" role="status" aria-live="polite" aria-atomic="true"></p>
          <a class="button button-primary whatsapp-share" id="whatsappShare" href="" target="_blank" rel="noopener noreferrer">
            <svg class="whatsapp-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11.5a8 8 0 0 1-11.8 7L4 19.5l1.1-4A8 8 0 1 1 20 11.5Z"/><path d="M9 8.5c.5 3 2 4.5 5 5l1-1c.5-.5 1.5.5 1 1.5s-2 1-3.5.5-4-3-4.5-5.5c-.2-1.5.5-2 1-2S9.5 8 9 8.5Z"/></svg>
            <span id="whatsappShareLabel"></span>
          </a>
        </form>
      </div>
    </section>

    <section class="closing-section section" id="closing" aria-labelledby="closingTitle">
      <div class="closing-glow" aria-hidden="true"></div>
      <img class="closing-floral closing-floral-left" data-asset="floral" alt="" aria-hidden="true">
      <img class="closing-floral closing-floral-right" data-asset="floral" alt="" aria-hidden="true">
      <div class="section-inner narrow center reveal">
        <p class="eyebrow" id="closingEyebrow"></p>
        <h2 class="section-title" id="closingTitle"></h2>
        <p class="closing-message" id="closingMessage"></p>
        <div class="fine-rule" aria-hidden="true"><span></span><i></i><span></span></div>
        <p class="closing-signoff" id="closingSignoff"></p>
        <p class="closing-names script" id="closingNames"></p>
        <button class="button button-outline" id="backToCover" type="button"></button>
      </div>
    </section>
  </main>

  <footer class="footer" id="footer" hidden>
    <p id="footerText"></p>
  </footer>
</body>
</html>
